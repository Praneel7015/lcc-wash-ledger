name: Deploy Web Dashboard to Firebase Hosting

on:
  push:
    branches:
      - main
  # Lets you re-run a deploy without an empty commit.
  workflow_dispatch:

# Two pushes in quick succession used to race each other onto the live
# channel; the later one now waits and the earlier in-flight run is cancelled.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Gate the deploy on a clean analysis. Infos (mostly style lints such as
      # prefer_const_constructors) do not block; warnings and errors do.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Flutter web (release)
        run: flutter build web --release --no-tree-shake-icons

      # Deploy Firestore rules and Storage rules using the Firebase CLI
      # directly (no third-party action), so the same service-account JSON
      # that FirebaseExtended/action-hosting-deploy uses can be reused here
      # without any base64-encoding gymnastics.
      - name: Deploy Firestore & Storage rules
        run: |
          npm install -g firebase-tools
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          firebase deploy --only firestore:rules,storage \
            --project wash-ledgar \
            --token "" 2>/dev/null || \
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            firebase deploy --only firestore:rules,storage \
            --project wash-ledgar
          rm -f /tmp/sa.json

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: wash-ledgar
          channelId: live
