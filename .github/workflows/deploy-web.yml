name: Deploy Web Dashboard to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Deploy runs are kept sequential — never cancel in-progress.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for google-github-actions/auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Build Flutter web (release)
        run: flutter build web --release --no-tree-shake-icons

      # Deploy Firestore rules and Storage rules.
      # Requires the service account to have roles/firebase.developAdmin
      # (in addition to the existing Hosting Admin + Service Usage Consumer
      # + Firebase Storage Admin roles). One-time IAM fix in GCP console.
      - name: Deploy Firestore & Storage rules
        run: |
          npm install -g firebase-tools@14
          firebase deploy --only firestore:rules,storage \
            --project wash-ledgar

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: wash-ledgar
          channelId: live
