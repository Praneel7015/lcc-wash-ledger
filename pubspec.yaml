name: washlog
description: Carwash customer tracking — worker Android app + owner web dashboard
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2

  # State management & routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.3.0

  # Camera & images
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # ML Kit OCR (Android only)
  google_mlkit_text_recognition: ^0.13.1

  # UI helpers
  intl: ^0.19.0
  fl_chart: ^0.69.0
  gap: ^3.0.1

  # Utilities
  uuid: ^4.5.1
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
