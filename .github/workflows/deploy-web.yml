name: Deploy Web Dashboard to Firebase Hosting

on:
  push:
    branches:
      - main
  # Lets you re-run a deploy without an empty commit.
  workflow_dispatch:

# Two pushes in quick succession used to race each other onto the live
# channel; the later one now waits and the earlier in-flight run is cancelled.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Gate the deploy on a clean analysis. Infos (mostly style lints such as
      # prefer_const_constructors) do not block; warnings and errors do.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Flutter web (release)
        run: flutter build web --release --no-tree-shake-icons

      # Deploy Firestore rules, Storage rules, and Hosting in one command so
      # all three are always in sync with the code that references them.
      # The hosting-deploy action below only handles Hosting; rules changes
      # would otherwise silently stay on the old version in production.
      - name: Deploy Firestore & Storage rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules,storage --project wash-ledgar
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: wash-ledgar
          channelId: live
