name: Deploy Web Dashboard to Firebase Hosting

on:
  push:
    branches:
      - main
  # Lets you re-run a deploy without an empty commit.
  workflow_dispatch:

# Two pushes in quick succession used to race each other onto the live
# channel; the later one now waits and the earlier in-flight run is cancelled.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for google-github-actions/auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Gate the deploy on a clean analysis. Infos (mostly style lints such as
      # prefer_const_constructors) do not block; warnings and errors do.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Flutter web (release)
        run: flutter build web --release --no-tree-shake-icons

      # Deploy Firestore rules and Storage rules using the Firebase CLI with
      # ADC credentials set by google-github-actions/auth above.
      - name: Deploy Firestore & Storage rules
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules,storage \
            --project wash-ledgar

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: wash-ledgar
          channelId: live
