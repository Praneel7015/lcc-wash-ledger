name: Build & Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK & Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Guard: workflow_dispatch sets GITHUB_REF_NAME to the branch name,
          # not a semver tag. Writing "version: main+1" into pubspec.yaml
          # is not valid semver and aborts flutter pub get on the next step.
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9] ]]; then
            echo "::error::Build APK must be triggered by a v* tag (got: ${TAG}). Run: git tag vX.Y.Z && git push origin vX.Y.Z"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch pubspec.yaml version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Preserve the build number (+1) if version has no build number
          if [[ "$VERSION" != *"+"* ]]; then
            BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
            VERSION="${VERSION}+${BUILD_NUMBER}"
          fi
          sed -i "s/^version: .*/version: ${VERSION}/" pubspec.yaml
          echo "Updated pubspec.yaml version to: ${VERSION}"
          grep '^version:' pubspec.yaml

      - name: Setup Java (JDK 17, Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      # Catch analysis failures before spending ~5 minutes on a release build
      # that would ship broken. Infos do not block; warnings and errors do.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Luxury Car Care v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup secrets from disk
        if: always()
        run: rm -f android/app/google-services.json
